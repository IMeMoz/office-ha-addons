name: Bluetooth speaker keeper
version: "1.0.5"
slug: bt_speaker
description: Pairs a Bluetooth speaker with the Pi's Bluetooth and keeps it connected so Home Assistant OS's audio service can use it as an output.
arch: [aarch64, amd64, armv7]
startup: services
boot: auto
init: false
stdin: true
host_network: true
host_dbus: true
privileged:
  - NET_ADMIN
options:
  mac: ""
  scan_seconds: 20
schema:
  mac: str
  scan_seconds: int(5,120)
